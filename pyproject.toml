[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tracertool"
version = "0.2.0"
description = "A local desktop workbench for assisted terrain breakline and stream tracing"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = ["numpy>=1.26,<3", "scipy>=1.12,<2", "rasterio>=1.3,<2", "PySide6>=6.7,<7", "pyshp>=2.3,<4", "scikit-image>=0.23,<1"]

[project.optional-dependencies]
dev = ["pytest>=8", "pyinstaller>=6"]

[project.gui-scripts]
tracertool = "tracertool.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
